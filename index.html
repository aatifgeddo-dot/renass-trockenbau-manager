<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RENASS TROCKENBAU | Hannover</title>

    <meta name="description"
          content="RENASS TROCKENBAU – Trockenbau, Innenausbau, Decken, Gipskarton, Trennwände, Dämmung, Rückbau und Malerarbeiten in Hannover.">

    <meta name="theme-color" content="#0b2f5b">

    <style>
        /* =========================================================
           RENASS TROCKENBAU
           Modern Website - Hannover
           ========================================================= */

        :root {
            --red: #c51f24;
            --red-dark: #a9181d;
            --blue: #0b2f5b;
            --blue-light: #123f73;
            --white: #ffffff;
            --black: #111111;
            --gray-1: #f5f7fa;
            --gray-2: #e7ebf0;
            --gray-3: #6b7280;
            --shadow: 0 15px 40px rgba(11, 47, 91, 0.12);
            --radius: 18px;
            --transition: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--gray-1);
            color: var(--black);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        .container {
            width: min(1180px, 92%);
            margin: auto;
        }

        /* =========================================================
           TOP BAR
           ========================================================= */

        .topbar {
            background: var(--blue);
            color: var(--white);
            font-size: 14px;
        }

        .topbar-inner {
            min-height: 42px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .topbar-left,
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .topbar a {
            transition: var(--transition);
        }

        .topbar a:hover {
            color: #ffcccc;
        }

        /* =========================================================
           HEADER
           ========================================================= */

        header {
            background: rgba(255, 255, 255, 0.96);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            backdrop-filter: blur(12px);
        }

        .nav-container {
            min-height: 82px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .brand-logo {
            width: 65px;
            height: 65px;
            object-fit: contain;
            border-radius: 10px;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 21px;
            font-weight: 900;
            color: var(--blue);
            letter-spacing: 0.5px;
        }

        .brand-name span {
            color: var(--red);
        }

        .brand-location {
            font-size: 12px;
            color: var(--gray-3);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        nav a {
            position: relative;
            padding: 10px 13px;
            font-size: 14px;
            font-weight: 700;
            color: var(--blue);
            border-radius: 8px;
            transition: var(--transition);
        }

        nav a:hover,
        nav a.active {
            color: var(--red);
            background: #fff3f3;
        }

        .nav-cta {
            background: var(--red) !important;
            color: white !important;
            padding: 12px 18px !important;
        }

        .nav-cta:hover {
            background: var(--red-dark) !important;
            transform: translateY(-2px);
        }

        .menu-toggle {
            display: none;
            width: 44px;
            height: 44px;
            border: none;
            background: var(--blue);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 22px;
        }

        /* =========================================================
           HERO
           ========================================================= */

        .hero {
            min-height: 720px;
            background:
                linear-gradient(
                    90deg,
                    rgba(5, 22, 42, 0.94) 0%,
                    rgba(5, 22, 42, 0.75) 48%,
                    rgba(5, 22, 42, 0.25) 100%
                ),
                url("renass-hero.jpg") center/cover no-repeat;
            display: flex;
            align-items: center;
            color: white;
            position: relative;
        }

        .hero-content {
            max-width: 750px;
            padding: 90px 0;
            animation: heroIn 1s ease forwards;
        }

        @keyframes heroIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .badge {
            display: inline-flex;
            padding: 8px 14px;
            background: rgba(197, 31, 36, 0.95);
            border-radius: 50px;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 22px;
        }

        .hero h1 {
            font-size: clamp(44px, 7vw, 78px);
            line-height: 1.02;
            margin-bottom: 25px;
            letter-spacing: -2px;
        }

        .hero h1 span {
            color: #ff5555;
        }

        .hero p {
            max-width: 680px;
            font-size: 19px;
            color: #eef3f8;
            margin-bottom: 32px;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 13px;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border: none;
            border-radius: 10px;
            padding: 14px 22px;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--red);
            color: white;
        }

        .btn-primary:hover {
            background: var(--red-dark);
            transform: translateY(-3px);
        }

        .btn-light {
            background: white;
            color: var(--blue);
        }

        .btn-light:hover {
            transform: translateY(-3px);
            background: #f2f2f2;
        }

        /* =========================================================
           STATS
           ========================================================= */

        .stats {
            margin-top: -50px;
            position: relative;
            z-index: 10;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .stat {
            padding: 28px;
            text-align: center;
            border-right: 1px solid var(--gray-2);
        }

        .stat:last-child {
            border-right: none;
        }

        .stat strong {
            display: block;
            font-size: 28px;
            color: var(--blue);
        }

        .stat span {
            color: var(--gray-3);
            font-size: 14px;
        }

        /* =========================================================
           SECTIONS
           ========================================================= */

        section {
            padding: 95px 0;
        }

        .section-head {
            text-align: center;
            max-width: 760px;
            margin: 0 auto 50px;
        }

        .section-kicker {
            color: var(--red);
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .section-head h2 {
            color: var(--blue);
            font-size: clamp(32px, 5vw, 48px);
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .section-head p {
            color: var(--gray-3);
        }

        /* =========================================================
           SERVICES
           ========================================================= */

        .services {
            background: white;
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .service-card {
            background: white;
            border: 1px solid var(--gray-2);
            border-radius: var(--radius);
            overflow: hidden;
            transition: var(--transition);
            box-shadow: 0 7px 22px rgba(0, 0, 0, 0.04);
        }

        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow);
            border-color: #d5dce5;
        }

        .service-image {
            height: 210px;
            overflow: hidden;
            background: #dfe5eb;
        }

        .service-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.6s ease;
        }

        .service-card:hover .service-image img {
            transform: scale(1.08);
        }

        .service-content {
            padding: 23px;
        }

        .service-content h3 {
            color: var(--blue);
            font-size: 21px;
            margin-bottom: 8px;
        }

        .service-content p {
            color: var(--gray-3);
            font-size: 14px;
        }

        /* =========================================================
           GALLERY
           ========================================================= */

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .gallery-item {
            height: 250px;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            background: #ddd;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        .gallery-label {
            position: absolute;
            left: 12px;
            bottom: 12px;
            background: rgba(11, 47, 91, 0.88);
            color: white;
            padding: 7px 11px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 700;
        }

        /* =========================================================
           BEFORE / AFTER
           ========================================================= */

        .before-after {
            background: var(--blue);
            color: white;
        }

        .before-after .section-head h2 {
            color: white;
        }

        .before-after .section-head p {
            color: #cbd8e6;
        }

        .ba-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .ba-card {
            background: white;
            border-radius: var(--radius);
            overflow: hidden;
            color: var(--black);
        }

        .ba-images {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 330px;
        }

        .ba-images div {
            position: relative;
            overflow: hidden;
        }

        .ba-images img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ba-label {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.72);
            color: white;
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 800;
        }

        .ba-text {
            padding: 20px;
        }

        .ba-text h3 {
            color: var(--blue);
            margin-bottom: 5px;
        }

        /* =========================================================
           UPLOAD
           ========================================================= */

        .upload-section {
            background: white;
        }

        .upload-box {
            max-width: 850px;
            margin: auto;
            background: var(--gray-1);
            border: 2px dashed #c8d0da;
            border-radius: var(--radius);
            padding: 40px;
            text-align: center;
            transition: var(--transition);
        }

        .upload-box:hover {
            border-color: var(--red);
            background: #fffafa;
        }

        .upload-icon {
            font-size: 50px;
            margin-bottom: 12px;
        }

        .upload-box h3 {
            color: var(--blue);
            margin-bottom: 8px;
        }

        .upload-box p {
            color: var(--gray-3);
            margin-bottom: 20px;
        }

        #customerImage {
            display: none;
        }

        .preview {
            margin-top: 25px;
            display: none;
        }

        .preview img {
            max-width: 500px;
            max-height: 350px;
            margin: auto;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        /* =========================================================
           CALCULATORS
           ========================================================= */

        .calculators {
            background: var(--gray-1);
        }

        .calculator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .calculator-card {
            background: white;
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: 0 7px 25px rgba(0, 0, 0, 0.05);
        }

        .calculator-card h3 {
            color: var(--blue);
            font-size: 25px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: var(--blue);
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13

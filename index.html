<!DOCTYPE html>
<html lang="de">
<head>

    <title>RENAß Trockenbau | Management System</title>

        :root {

            --primary-blue: #0f2537; /* لون الشعار الكحلي */

        }
        body {

            background-color: var(--bg-light);
            display: flex;
            justify-content: center;

        }
        .welcome-box {
            background: white;

            border-top: 6px solid var(--primary-blue);
        }
        h1 { color: var(--primary-blue); margin-bottom: 5px; }
        span { color: var(--primary-red); }
        p { color: #27ae60; font-size: 18px; font-weight: bold; }

</head>
<body>

    <div class="welcome-box">
        <h1>RENA<span>ß</span> Trockenbau</h1>
        <div style="color: #7f8c8d; font-size: 14px; margin-bottom: 20px;">Management System</div>
        <hr style="border:0; height:1px; background:#e0e0e0;">
        <p>Willkommen! Das System wurde erfolgreich aktiviert.</p>
        <small style="color: #95a5a6;">أول رسالة برمجية ناجحة لموقع إدارة أعمالك.</small>
